[package]
name = "kernel"
version = "0.5.0"
edition = "2021"
publish = false

[dependencies]
bootloader_api = "0.11"
linked_list_allocator = "0.10"
# Phase 1 (interrupts): these are the standard, minimal, no_std building
# blocks for x86_64 GDT/IDT/TSS/PIC work. Hand-rolling descriptor byte
# layouts and PIC remap sequences in raw unsafe asm would sharply increase
# unsafe surface area and bug risk for no architectural benefit -- these
# crates exist specifically to keep that code small, reviewed, and correct.
x86_64 = "0.14"
pic8259 = "0.10"
uart_16550 = "0.3"
spin = "0.9"
lazy_static = { version = "1.5", features = ["spin_no_std"] }
smoltcp = { version = "0.13.1", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-dhcpv4",
    "socket-dns",
    "socket-udp",
] }

[[bin]]
name = "kernel"
test = false
bench = false
